# 本地/单机部署编排（PostgreSQL + Redis + 一体化应用镜像），对应《09》第 8 节与 docs/ops/部署指南.md。
# 用法：docker compose --env-file backend/.env up -d
name: contract-risk

# 应用与迁移服务共用环境变量（YAML 锚点，避免重复）
x-app-env: &app-env
  APP_ENV: prod
  DEBUG: "false"
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置初始超管密码}
  JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
  FERNET_KEY: ${FERNET_KEY:?请设置 FERNET_KEY}
  # 聚合连接串（《02》4.6）：compose 内请指向服务名 postgres / redis
  DATABASE_URL: ${DATABASE_URL:?请设置 DATABASE_URL（如 postgresql+asyncpg://app_user:密码@postgres:5432/contract_risk）}
  REDIS_URL: ${REDIS_URL:?请设置 REDIS_URL（如 redis://redis:6379/0）}
  # 连接池参数
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
  DB_ECHO: ${DB_ECHO:-false}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
  # AI 增强识别（可选）
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
  AI_CONTEXT_CHARS: ${AI_CONTEXT_CHARS:-30000}
  AI_MAX_FINDINGS: ${AI_MAX_FINDINGS:-50}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contract_risk}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-contract_risk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # 本地默认无密码；生产建议通过 command 覆盖启用 requirepass 或使用托管 Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/liugangqiang/contract-risk:latest
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/liugangqiang/contract-risk:latest
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
