# 构建并推送一体化镜像到阿里云 ACR（《09》第 8 节 / docs/ops/部署指南.md）
# 一体化镜像：Nginx（前端静态资源 + /api 反代）与 Uvicorn（后端）同容器。
# 触发：push main / tag v* / 手动（可指定 image_tag）
# 密钥：GitHub Actions Secrets 配置 ACR_USERNAME、ACR_PASSWORD
name: Build & Push ACR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 镜像版本标签（如 v0.1.0）；留空则按触发来源自动生成
        required: false
        type: string

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_REPO: liugangqiang/contract-risk

concurrency:
  group: acr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标签规范：<version>；tag 发布额外打 latest，始终附带 sha-<7>
      - name: Compute image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            VERSION="${INPUT_IMAGE_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          SHA_SHORT="${GITHUB_SHA::7}"
          REG="${REGISTRY}/${IMAGE_REPO}"
          TAGS="${REG}:${VERSION}"
          if [ "${VERSION}" != "latest" ]; then
            TAGS="${TAGS},${REG}:latest"
          fi
          TAGS="${TAGS},${REG}:sha-${SHA_SHORT}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # ubuntu-latest 默认 docker driver 不支持 gha 缓存导出，需先启用 docker-container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # ACR 个人版不识别 buildx 默认的 attestation/provenance OCI 空 manifest，需关闭
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "已推送镜像：${{ steps.meta.outputs.tags }}"
